[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetris-versus-interface"
version = "0.1.0"
description = "Cliente de terminal e motor local de Tetris Versus"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tetris_client = "tetris_client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
